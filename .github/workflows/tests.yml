name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install package
        run: python -m pip install -e ".[dev]"

      # xvfb-run gives tkinter a display so the GUI tests run instead of skipping.
      - name: Run tests
        run: xvfb-run -a python -m pytest -rs
